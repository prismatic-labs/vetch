[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vetch"
version = "0.1.3"
description = "Planet-aware observability for LLM inference"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Prismatic Labs" }
]
keywords = ["llm", "energy", "carbon", "observability", "openai", "vertexai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0,<2.0"]
vertexai = ["google-cloud-aiplatform>=1.0"]
tiktoken = ["tiktoken>=0.5.0"]  # Accurate token counting for OpenAI models
calibrate = ["nvidia-ml-py3"]  # Hardware power sensing for NVIDIA GPUs
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "tiktoken>=0.5.0",  # For token estimation tests
]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0",
    "build",
    "twine",
]

[project.scripts]
vetch = "vetch.cli:main"

[project.urls]
Homepage = "https://github.com/prismatic-labs/vetch"
Documentation = "https://github.com/prismatic-labs/vetch#readme"
Repository = "https://github.com/prismatic-labs/vetch"
Issues = "https://github.com/prismatic-labs/vetch/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vetch"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/SECURITY.md",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "--cov=vetch",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM102", "SIM108"]  # Allow nested if and if-else blocks for readability

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SIM105", "SIM117", "F841"]  # Allow unused vars in context managers

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
