[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vetch"
version = "0.10.1"
description = "Inference waste control for production LLM systems. Detect stalled agents, RAG bloat, and runaway inference — then stop them automatically."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Prismatic Labs", email = "marco@prismaticlabs.ai" }
]
keywords = [
    "llm", "energy", "carbon", "cost", "observability", "opentelemetry",
    "openai", "anthropic", "google", "gemini", "vertexai",
    "ollama", "self-hosted", "vllm", "gpu", "finops", "sustainability",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/prismatic-labs/vetch"
Documentation = "https://github.com/prismatic-labs/vetch#readme"
Repository = "https://github.com/prismatic-labs/vetch.git"
Issues = "https://github.com/prismatic-labs/vetch/issues"

[project.optional-dependencies]
# Provider SDKs (uniform, first-class extras: pip install vetch[<provider>])
openai = ["openai>=1.0,<2.0"]
anthropic = ["anthropic>=0.18"]
vertexai = ["google-cloud-aiplatform>=1.0"]
genai = ["google-genai>=0.1.0"]  # Google GenAI SDK
ollama = ["ollama>=0.1"]
tiktoken = ["tiktoken>=0.5.0"]  # Accurate token counting for OpenAI models
calibrate = ["nvidia-ml-py3"]  # Hardware power sensing for NVIDIA GPUs
apple-silicon = ["numpy>=1.24"]  # Apple Silicon energy calibration via powermetrics
otel = [  # OpenTelemetry OTLP export
    "opentelemetry-sdk>=1.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.0",
]
opentelemetry = ["opentelemetry-api>=1.0"]  # GenAI semantic conventions exporter
mcp = ["mcp>=1.0,<2.0"]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.0",
    "tiktoken>=0.5.0",  # For token estimation tests
    "opentelemetry-api>=1.0",  # For OpenTelemetry integration tests
]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0",
    "build",
    "twine",
]

[project.scripts]
vetch = "vetch.cli:main"
vetch-mcp = "vetch.mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vetch"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/data",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/SECURITY.md",
    "/CHANGELOG.md",
]
exclude = [
    "/kudzu",
    "/tests/test_kudzu_recipes.py",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Coverage flags are passed explicitly in CI (.github/workflows/ci.yml), not via
# addopts, so running a subset locally (e.g. `pytest tests/test_config.py`) does
# not fail the 70% gate. Run coverage locally with:
#   pytest --cov=vetch --cov-report=term-missing --cov-fail-under=70
addopts = []

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM102", "SIM105", "SIM108"]  # Allow nested if, try-except-pass, and if-else blocks

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SIM105", "SIM117", "F841"]  # Allow unused vars in context managers

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false  # Allow ignores for optional dependencies (CI vs local)

[[tool.mypy.overrides]]
module = [
    "google",
    "google.*",
    "opentelemetry",
    "opentelemetry.*",
    "fastapi",
    "fastapi.*",
    "mcp",
    "mcp.*",
    "numpy",
    "numpy.*",
    "ollama",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B110", "B112", "B311", "B310", "B404", "B603", "B607"]  # B101: asserts for mypy narrowing; B110/B112: fail-open by design; B311: random for jitter, not crypto; B310: urlopen with validated URLs; B404/B603/B607: subprocess with fixed system-tool args (sysctl/powermetrics/system_profiler)
