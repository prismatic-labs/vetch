[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vetch"
version = "0.2.1"
description = "Planet-aware observability for LLM inference"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Prismatic Labs", email = "marco@prismaticlabs.ai" }
]
keywords = ["llm", "energy", "carbon", "observability", "openai", "vertexai", "anthropic"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/prismatic-labs/vetch"
Documentation = "https://github.com/prismatic-labs/vetch#readme"
Repository = "https://github.com/prismatic-labs/vetch.git"
Issues = "https://github.com/prismatic-labs/vetch/issues"

[project.optional-dependencies]
openai = ["openai>=1.0,<2.0"]
vertexai = ["google-cloud-aiplatform>=1.0"]
genai = ["google-genai>=0.1.0"]  # Google GenAI SDK
tiktoken = ["tiktoken>=0.5.0"]  # Accurate token counting for OpenAI models
calibrate = ["nvidia-ml-py3"]  # Hardware power sensing for NVIDIA GPUs
otel = [  # OpenTelemetry OTLP export
    "opentelemetry-sdk>=1.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.0",
]
opentelemetry = ["opentelemetry-api>=1.0"]  # GenAI semantic conventions exporter
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.0",
    "tiktoken>=0.5.0",  # For token estimation tests
    "opentelemetry-api>=1.0",  # For OpenTelemetry integration tests
]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0",
    "build",
    "twine",
]

[project.scripts]
vetch = "vetch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vetch"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/SECURITY.md",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "--cov=vetch",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM102", "SIM105", "SIM108"]  # Allow nested if, try-except-pass, and if-else blocks

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SIM105", "SIM117", "F841"]  # Allow unused vars in context managers

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false  # Allow ignores for optional dependencies (CI vs local)

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B110", "B112", "B311", "B310"]  # B101: asserts for mypy narrowing; B110/B112: fail-open by design; B311: random for jitter, not crypto; B310: urlopen with validated URLs
