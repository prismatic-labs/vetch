name: Capability perf soak

# Long-running memory-boundedness + sustained-concurrency soak for the capability
# rollup. Too slow for per-PR CI, so it runs weekly (and on demand). Guards
# against memory leaks in the per-session sets and lock contention under load.

on:
  schedule:
    - cron: "0 4 * * 1"   # weekly, Monday 04:00 UTC
  workflow_dispatch:
    inputs:
      iters:
        description: "Number of update iterations"
        required: false
        default: "200000"

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VETCH_SOAK: "1"
      VETCH_SOAK_ITERS: ${{ github.event.inputs.iters || '200000' }}
      VETCH_SOAK_DISTINCT: "5000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.3.0
        with:
          python-version: "3.12"

      - name: Install vetch + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dev]"

      - name: Run soak
        run: pytest -v --no-cov tests/test_capability_soak.py
