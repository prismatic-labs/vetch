name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=vetch --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check src/ tests/

      - name: Run mypy
        run: mypy src/

  calculator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Regenerate calculator embed
        run: python scripts/build_calculator.py

      - name: Assert calculator HTML is up to date
        run: git diff --exit-code docs/calculator/index.html

      - name: Calculator parity tests
        run: pytest tests/test_calculator_parity.py -v --no-cov

      - name: Registry parity and freshness
        run: python scripts/check_registry_freshness.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit security scan
        run: bandit -r src/ -c pyproject.toml

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

  ai-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/vetch-ai-sdk/package-lock.json

      - name: Install dependencies
        working-directory: packages/vetch-ai-sdk
        run: npm ci

      - name: Typecheck
        working-directory: packages/vetch-ai-sdk
        run: npm run check

      - name: Verify registry snapshots match Python
        run: python scripts/sync_ai_sdk_registries.py

      - name: Test
        working-directory: packages/vetch-ai-sdk
        run: npm test

      - name: Verify npm pack contents
        working-directory: packages/vetch-ai-sdk
        run: npm pack --dry-run

  release:
    runs-on: ubuntu-latest
    needs: [test, lint, security, package, ai-sdk, calculator]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide whether tag matches the Python package version
        id: pyvercheck
        run: |
          PKG_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" = "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION matches Python package version; will publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG_VERSION != Python package version $PKG_VERSION; skipping PyPI publish (npm-only release)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install build tools
        if: steps.pyvercheck.outputs.publish == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        if: steps.pyvercheck.outputs.publish == 'true'
        run: python -m build
      - name: Publish to PyPI
        if: steps.pyvercheck.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  npm-release:
    runs-on: ubuntu-latest
    needs: [test, lint, security, package, ai-sdk, calculator]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write  # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/vetch-ai-sdk/package-lock.json

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22 ships an older npm.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        working-directory: packages/vetch-ai-sdk
        run: npm ci

      - name: Build
        working-directory: packages/vetch-ai-sdk
        run: npm run build

      - name: Decide whether tag matches the JS package version
        id: vercheck
        working-directory: packages/vetch-ai-sdk
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" = "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION matches package version; will publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG_VERSION != package version $PKG_VERSION; skipping npm publish (Python-only release)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Tokenless: authenticates via OIDC. Requires a Trusted Publisher configured
      # on the npm package (Settings -> Trusted Publisher -> GitHub Actions).
      - name: Publish to npm (trusted publishing, with provenance)
        if: steps.vercheck.outputs.publish == 'true'
        working-directory: packages/vetch-ai-sdk
        run: npm publish --provenance --access public
