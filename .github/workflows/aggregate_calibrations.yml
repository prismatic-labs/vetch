name: Aggregate calibrations

on:
  # Run when an issue is labelled 'calibration' (new submission)
  issues:
    types: [labeled]
  # Also run on a daily schedule to catch edits/closures
  schedule:
    - cron: "0 3 * * *"
  # Manual trigger
  workflow_dispatch:

jobs:
  aggregate:
    # Only run on label events if the label is 'calibration'
    if: >
      github.event_name != 'issues' ||
      github.event.label.name == 'calibration'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit updated calibrations.json
      issues: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggregate calibration submissions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/aggregate_calibrations.py --repo ${{ github.repository }}

      - name: Commit updated calibrations.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/calibrations.json data/calibrations_suspect.json
          # Only commit if something changed
          git diff --cached --quiet || git commit -m "chore: update community calibrations [skip ci]"
          git push
