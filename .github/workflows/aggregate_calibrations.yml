name: Aggregate calibrations

on:
  # Run when an issue is labelled 'calibration' (new submission)
  issues:
    types: [labeled]
  # Also run on a daily schedule to catch edits/closures
  schedule:
    - cron: "0 3 * * *"
  # Manual trigger
  workflow_dispatch:

# This job ingests untrusted, community-submitted issue content, and its output
# ships inside the published wheel (src/vetch/data/community_calibrations.json).
# It therefore never writes to main: it pushes a review branch for a human to
# open and merge a PR from. contents:write covers only that branch.
permissions:
  contents: write
  issues: read

jobs:
  aggregate:
    # Only run on label events if the label is 'calibration'
    if: >
      github.event_name != 'issues' ||
      github.event.label.name == 'calibration'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.3.0
        with:
          python-version: "3.12"

      - name: Aggregate calibration submissions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/aggregate_calibrations.py --repo ${{ github.repository }}

      # src/vetch/data/community_calibrations.json is what community_calibrations.py
      # loads at runtime and what ships in the wheel. Both files are currently empty
      # ([]), so there is no evidence either way about whether the packaged copy is
      # meant to mirror data/calibrations.json. Warn on divergence rather than
      # syncing on an assumption; decide the relationship when real records arrive.
      - name: Warn if the packaged copy has diverged
        run: |
          norm() { python3 -c 'import json,sys;json.dump(json.load(open(sys.argv[1])),sys.stdout,sort_keys=True)' "$1"; }
          if [ "$(norm data/calibrations.json)" != "$(norm src/vetch/data/community_calibrations.json)" ]; then
            echo "::warning::data/calibrations.json and the packaged src/vetch/data/community_calibrations.json differ. The packaged copy is what ships in the wheel."
          fi

      - name: Push review branch if calibrations changed
        run: |
          FILES="data/calibrations.json data/calibrations_suspect.json"
          if git diff --quiet -- $FILES; then
            echo "No calibration changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/calibrations
          git add $FILES
          git commit -m "chore: update community calibrations"
          git push -f origin bot/calibrations
          {
            echo "### Calibration update ready for review"
            echo
            echo "Pushed to \`bot/calibrations\`. This changes data that ships in the wheel."
            echo
            echo "[Open a pull request](https://github.com/${GITHUB_REPOSITORY}/compare/main...bot/calibrations?expand=1)"
            echo
            echo '```'
            git --no-pager diff --stat HEAD~1 -- $FILES 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
